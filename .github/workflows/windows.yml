# Builds code2pdf.exe on Windows (packaging/windows) and checks it: prints test projects with
# Chinese, Japanese and Korean text, a line range, parts mode and --changed.
name: Windows build

on:
  push:
    branches: [windows-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pango (MSYS2), for WeasyPrint
        run: |
          C:\msys64\usr\bin\bash -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-pango'
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Remove-Item C:\msys64\ucrt64\bin\python*.exe -ErrorAction SilentlyContinue
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: VERSION, as a GitHub tarball has it
        shell: bash
        run: echo "$(git describe --tags)|$(git rev-parse --short HEAD)|$(git log -1 --format=%cs)" > VERSION
      - run: python -m PyInstaller --noconfirm packaging/windows/code2pdf.spec
      - name: Check, with Pango no longer on PATH
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*msys64*' }) -join ';'
          python packaging/windows/check.py dist/code2pdf/code2pdf.exe checks
      - run: Compress-Archive -Path dist/code2pdf -DestinationPath code2pdf-windows.zip
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code2pdf-windows
          path: |
            code2pdf-windows.zip
            checks/*.pdf
